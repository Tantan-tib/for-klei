<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf3e6">
  <title>for klei</title>
  <meta name="description" content="press play">
  <meta property="og:type" content="website">
  <meta property="og:title" content="for klei">
  <meta property="og:description" content="press play">
  <meta property="og:image" content="https://[username].github.io/[repo-name]/assets/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://[username].github.io/[repo-name]/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="for klei">
  <meta name="twitter:description" content="press play">
  <meta name="twitter:image" content="https://[username].github.io/[repo-name]/assets/preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gaegu:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/play-button.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="photos.css">
  <link rel="stylesheet" href="lyrics.css">
  <link rel="stylesheet" href="letter.css">
  <link rel="stylesheet" href="montage.css">
  <link rel="stylesheet" href="volume.css">
  <link rel="stylesheet" href="lock.css">
  <link rel="stylesheet" href="outro.css">
  <link rel="stylesheet" href="captions.css">
  <link rel="stylesheet" href="polish.css">
</head>
<body>
  <div id="app" class="locked">
    <div id="stage">
      <div id="bg"></div>
      <div id="leaks"><div class="leak l1"></div><div class="leak l2"></div><div class="leak l3"></div></div>
      <canvas id="particles"></canvas>

      <div id="photos-root"></div>   <!-- photos.js fills this -->
      <div id="pulse"></div>
      <div id="bright"></div>
      <div id="lyrics-root"></div>   <!-- lyrics.js fills this (includes its own readability scrim) -->

      <div id="texts">               <!-- core: name, intro sub, big moments, final message -->
        <div id="sub" class="small"></div>
        <div id="name" class="neon display"></div>
        <div id="nameDeco" aria-hidden="true">   <!-- hand-drawn underline + doodled heart; draw themselves (timeline-driven) -->
          <svg id="nameLine" viewBox="0 0 200 20" preserveAspectRatio="none"><path pathLength="1" d="M3 12 C 28 5, 52 17, 88 10 S 150 5, 197 11"/></svg>
          <svg id="nameHeart" viewBox="0 0 40 38"><path pathLength="1" d="M20 34 C 9 26 3 19 5 11 C 7 4 16 3 20 11 C 24 3 33 4 35 11 C 37 18 31 26 21 35"/></svg>
        </div>
        <div id="hero" class="neon display"><div class="slam"></div></div>
        <div id="final" class="neon final"></div>
      </div>

      <div id="flash"></div>
      <div id="flash2"></div>
      <div id="fade"></div>
    </div>

    <!-- letter: outside #stage on purpose, so drop shakes never move it -->
    <div id="letter-root">
      <div class="lt-paper">
        <div class="lt-ribbon" aria-hidden="true"></div>
        <div class="lt-body" tabindex="0" role="region" aria-label="Letter"></div>
      </div>
      <div class="lt-env" aria-hidden="true"></div>
    </div>

    <!-- montage video: takes the letter's spot after the letter flies away (montage.js) -->
    <div id="montage-root">
      <div class="mt-frame">
        <video class="mt-video" muted playsinline preload="auto" poster="video/montage-poster.jpg" disablepictureinpicture>
          <source src="video/montage.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="debug-root"></div>      <!-- debug.js fills this when ?debug -->

    <button id="replay" type="button">replay</button>

    <div id="vol">
      <button id="volBtn" type="button" aria-label="Mute" title="Mute (M)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4z"/><path class="waves" d="M15 8.5a5 5 0 0 1 0 7M17.6 5.9a8.7 8.7 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="cross" d="M15.2 9.2l5 5.6m0-5.6l-5 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <input id="volSlider" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
    </div>

    <div id="start">
      <button id="play" type="button" disabled aria-label="Play">
        <span class="ring"></span><span class="ring r2"></span>
        <img src="assets/play-button.png" alt="" width="512" height="512" draggable="false" decoding="async">
      </button>
      <p id="startLabel">loading…</p>
    </div>

    <!-- lock screen (lock.js): sits above #start until the date is right -->
    <div id="lock">
      <form id="lockCard" class="lk-card" autocomplete="off" novalidate>
        <span class="lk-tape" aria-hidden="true"></span>
        <label id="lockTitle" class="lk-title" for="lockInput">what's our date?</label>
        <div class="lk-row">
          <input id="lockInput" class="lk-input" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" placeholder="mm/dd" aria-describedby="lockMsg">
          <button class="lk-go" type="submit">ok</button>
        </div>
        <p id="lockMsg" class="lk-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div id="rotate-hint" aria-hidden="true">turn your phone upright</div>

  <audio id="song" preload="auto" playsinline></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
  <!-- modules register themselves on window.Edit.modules; script.js (core) must be last -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="lrc.js"></script>
  <script src="lyrics.js"></script>
  <script src="photos.js"></script>
  <script src="letter.js"></script>
  <script src="montage.js"></script>
  <script src="volume.js"></script>
  <script src="confetti.js"></script>
  <script src="outro.js"></script>
  <script src="lock.js"></script>
  <script src="debug.js"></script>
  <script src="script.js"></script>
</body>
</html>
